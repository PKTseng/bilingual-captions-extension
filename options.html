<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雙語字幕設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings">
    <header class="page-header">
      <img src="icons/icon-128.png" alt="" width="52" height="52">
      <div>
        <h1>雙語字幕設定</h1>
        <p>管理 YouTube 字幕的翻譯等級與 AI 模型。</p>
      </div>
    </header>

    <fieldset class="card">
      <legend>預設翻譯等級</legend>
      <div id="tiers" class="tier-options"></div>
    </fieldset>

    <fieldset class="card" id="ai">
      <legend>AI 翻譯（OpenRouter）</legend>
      <div class="fields">
        <label>模型 ID
          <input type="text" class="model" aria-label="AI 模型 ID" placeholder="例如 deepseek/deepseek-v4.1-flash" spellcheck="false">
        </label>
        <label>詞彙表
          <textarea id="glossary" rows="5" maxlength="4000" spellcheck="false" aria-describedby="glossary-help"
            placeholder="LLM = 大型語言模型&#10;Kubernetes"></textarea>
        </label>
      </div>
      <p id="glossary-help" class="hint">每行一個詞。「原文 = 譯法」指定怎麼翻，只寫原文代表保留原文，以 # 開頭的行會略過。AI 只會收到這批字幕裡出現的詞。</p>
      <div class="checks">
        <label><input type="checkbox" id="fix-asr"> 修正自動產生的字幕：補上標點、改正明顯聽錯的字，並顯示修正後的原文</label>
        <label><input type="checkbox" id="prefetch-whole"> 影片播放超過 1 分鐘後，在背景翻完整部影片（之後跳到哪裡都不用等，會多花一點費用）</label>
      </div>
      <button type="button" class="test">測試翻譯</button>
      <span class="result" role="status"></span>
    </fieldset>

    <fieldset class="card">
      <legend>播放器模型選單</legend>
      <p>勾選要顯示的內建模型。取消勾選後，目前的翻譯設定仍會保留。</p>
      <div id="menu-models" class="columns"></div>
    </fieldset>

    <fieldset class="card">
      <legend>API 金鑰</legend>
      <p id="key-help">本機 <code>.env</code> 有填金鑰時會優先使用，欄位可留空。</p>
      <div class="columns fields">
        <label>OpenRouter
          <input type="password" id="key-openrouter" autocomplete="off" aria-describedby="key-help">
        </label>
      </div>
    </fieldset>

    <fieldset class="card" id="saved">
      <legend>已存的 AI 譯文</legend>
      <p>看過的影片會保留 AI 譯文，重看時直接顯示，不會再收費。最多保留最近 300 部影片（每個模型分開計算）。</p>
      <button type="button" class="clear">清除已存的譯文</button>
      <span class="result" role="status"></span>
    </fieldset>

    <footer class="actions">
      <span id="status" role="status"></span>
      <button type="button" id="save">儲存設定</button>
    </footer>
  </main>

  <script src="settings.js"></script>
  <script src="ai-translator.js"></script>
  <script src="translation-store.js"></script>
  <script src="options.js"></script>
</body>
</html>
