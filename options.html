<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>雙語字幕設定</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    fieldset { margin: 0 0 16px; padding: 12px 16px; }
    label { display: block; margin: 6px 0; }
    input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input[type="text"] { flex: 1; }
    .result { margin-left: 8px; color: #555; }
  </style>
</head>
<body>
  <h1>雙語字幕設定</h1>

  <fieldset>
    <legend>預設翻譯等級</legend>
    <div id="tiers"></div>
  </fieldset>

  <fieldset>
    <legend>API key</legend>
    <label>OpenRouter key
      <input type="password" id="key-openrouter" autocomplete="off">
    </label>
    <label>Gemini key
      <input type="password" id="key-gemini" autocomplete="off">
    </label>
  </fieldset>

  <fieldset id="aiFree">
    <legend>AI 免費</legend>
    <div class="row">
      <select class="provider"></select>
      <input type="text" class="model" placeholder="模型名稱">
      <button type="button" class="test">測試</button>
    </div>
    <span class="result"></span>
  </fieldset>

  <fieldset id="aiPro">
    <legend>AI 進階</legend>
    <div class="row">
      <select class="provider"></select>
      <input type="text" class="model" placeholder="模型名稱">
      <button type="button" class="test">測試</button>
    </div>
    <span class="result"></span>
  </fieldset>

  <button type="button" id="save">儲存</button>
  <span id="status"></span>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
